# Runs the OLJ weekly brief every Monday and emails it at 09:15 Beirut time.
#
# GitHub's scheduler only speaks UTC and Lebanon switches between UTC+3 (summer) and UTC+2 (winter),
# so there are two triggers and only the one that equals 08:40 Beirut *today* continues. The notebook
# finishes in a few minutes, then its email cell waits until 09:15 (SEND_AT) before sending.
# Starting at :40 rather than on the hour also avoids GitHub's busiest (most delayed) slot.
#
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   CMS_API_KEY          the CMS API key
#   GSHEET_SA_KEY        full contents of service_account.json (Sheets + GA4 access)
#   GMAIL_ADDRESS        sending Gmail account
#   GMAIL_APP_PASSWORD   its 16-character App Password
# Optional repo VARIABLE (same page, "Variables" tab -- not a secret):
#   BRIEF_RECIPIENTS     comma-separated list for the Monday send; overrides SCHEDULED_RECIPIENTS in the notebook
#   Manual "Run workflow" test runs always go to TEST_RECIPIENTS only.
name: OLJ weekly brief

on:
  schedule:
    - cron: "40 5 * * 1"   # 08:40 Beirut in summer (UTC+3)
    - cron: "40 6 * * 1"   # 08:40 Beirut in winter (UTC+2)
  workflow_dispatch:        # "Run workflow" button, for tests
    inputs:
      send_email:
        description: "Send the email? (off = build and export only)"
        type: boolean
        default: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Pick the trigger that matches Beirut's current UTC offset
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=Asia/Beirut date +%z)" = "+0300" ]; then want="40 5 * * 1"; else want="40 6 * * 1"; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Not today's slot (daylight saving) -- skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Install LibreOffice (for the PDF copy) + Calibri-compatible font
        if: steps.gate.outputs.go == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer fonts-crosextra-carlito

      - name: Install Python packages
        if: steps.gate.outputs.go == 'true'
        run: >
          pip install -q jupyter nbconvert ipykernel pandas openpyxl requests python-docx
          google-api-python-client google-auth google-auth-oauthlib google-analytics-data

      - name: Write the service-account key
        if: steps.gate.outputs.go == 'true'
        run: echo '${{ secrets.GSHEET_SA_KEY }}' > service_account.json

      - name: Run the notebook (builds, exports, then emails at 09:15)
        if: steps.gate.outputs.go == 'true'
        env:
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_RECIPIENTS: ${{ vars.BRIEF_RECIPIENTS }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' && '1' || (inputs.send_email && '1' || '0') }}
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: >
          jupyter nbconvert --to notebook --execute weekly_report_OLJ.ipynb
          --output executed_weekly_report.ipynb --ExecutePreprocessor.timeout=5400

      - name: Keep the brief + executed notebook (Actions run -> Artifacts)
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brief
          path: |
            Weekly_Analytics_Brief_OLJ_*.docx
            Weekly_Analytics_Brief_OLJ_*.pdf
            executed_weekly_report.ipynb
          if-no-files-found: ignore

      - name: Remove the key file
        if: always()
        run: rm -f service_account.json
