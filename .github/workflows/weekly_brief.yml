# Weekly brief · PART 1 -- runs by itself every Monday at 11:25 Beirut time.
# Builds both briefs but sends NO briefs: it only emails you the Claude.ai file (CLAUDE_FILE_RECIPIENTS in the
# notebook's ⚙️ Settings). Then you run PART 2 (weekly_brief_part2.yml) with Claude's answer to send the briefs.
#
# Timing: GitHub schedules in UTC and Beirut changes its clock (UTC+3 in summer, UTC+2 in winter), so there
# are two start times. Only the one that means 11:25 Beirut *today* goes ahead; the other stops right away.
#
# Needed in the repo (Settings -> Secrets and variables -> Actions):
#   Secrets:   CMS_API_KEY, MATOMO_TOKEN, GSHEET_SA_KEY (the service account JSON: GA4, the acquisitions sheet,
#              Search Console), GMAIL_ADDRESS, GMAIL_APP_PASSWORD
#   Variables: BRIEF_RECIPIENTS_OLJ, BRIEF_RECIPIENTS_OT (optional; used only when SEND_TO = "everyone" in the notebook)

name: "Weekly brief · part 1"

on:
  schedule:
    - cron: "25 8 * * 1"   # 08:25 UTC = 11:25 Beirut in summer (UTC+3)
    - cron: "25 9 * * 1"   # 09:25 UTC = 11:25 Beirut in winter (UTC+2)
  workflow_dispatch:        # run part 1 by hand (e.g. to get the Claude file again)

permissions:
  contents: read

concurrency:
  group: weekly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check it's the right start time for today (summer / winter)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Asia/Beirut date +%z)
          RUN=true
          if [ "$EVENT" = "schedule" ]; then
            RUN=false
            if [ "$SCHED" = "25 8 * * 1" ] && [ "$OFFSET" = "+0300" ]; then RUN=true; fi
            if [ "$SCHED" = "25 9 * * 1" ] && [ "$OFFSET" = "+0200" ]; then RUN=true; fi
          fi
          echo "Beirut offset $OFFSET, trigger '$EVENT' '$SCHED' -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --quiet jupyter nbconvert ipykernel pandas openpyxl requests \
            google-api-python-client google-auth google-auth-oauthlib google-analytics-data python-docx

      - name: Write the service account key (GA4, the acquisitions Google Sheet, Search Console)
        if: steps.gate.outputs.run == 'true'
        env:
          GSHEET_SA_KEY: ${{ secrets.GSHEET_SA_KEY }}
        run: printf '%s' "$GSHEET_SA_KEY" > service_account.json

      - name: Run the notebook (builds the briefs, emails you the Claude.ai file)
        if: steps.gate.outputs.run == 'true'
        env:
          BRIEF_PART: "1"
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          MATOMO_TOKEN: ${{ secrets.MATOMO_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_RECIPIENTS_OLJ: ${{ vars.BRIEF_RECIPIENTS_OLJ }}
          BRIEF_RECIPIENTS_OT: ${{ vars.BRIEF_RECIPIENTS_OT }}
        run: |
          jupyter nbconvert --to notebook --execute weekly_report.ipynb \
            --output executed_weekly_report.ipynb --ExecutePreprocessor.timeout=-1

      - name: Keep the outputs (executed notebook, Word briefs, Claude.ai file, order CSV)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brief-part1-${{ github.run_id }}
          path: |
            executed_weekly_report.ipynb
            *.docx
            Claude_translations_*.txt
            acquisitions_orders.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove the service account key
        if: always()
        run: rm -f service_account.json
