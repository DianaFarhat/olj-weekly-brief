# Weekly Analytics Brief (OLJ + OT)
# Runs weekly_report.ipynb every Monday and emails both briefs at 12:00 Beirut time.
# It also emails the Claude.ai file (prompt + top 10s + top 400s, for the ★ ranks and English titles) in a separate
# email, only to CLAUDE_FILE_RECIPIENTS in the notebook's ⚙️ Settings; the file is also kept with the run's outputs.
#
# Timing: GitHub schedules in UTC and Beirut changes its clock (UTC+3 in summer, UTC+2 in winter), so there
# are two start times. Only the one that means 11:25 Beirut *today* goes ahead; the other stops right away.
# The notebook then waits until 12:00 (SEND_AT in the Email cell) and sends, even if GitHub started a bit late.
#
# With the ★ notes: Actions -> Weekly analytics brief -> Run workflow -> paste Claude's JSON line into "Claude answer",
# pick "everyone" (or "test" to check first) -> Run. The briefs are rebuilt with the notes and sent right away.
#
# Needed in the repo (Settings -> Secrets and variables -> Actions):
#   Secrets:   CMS_API_KEY, MATOMO_TOKEN, GSHEET_SA_KEY (the service account JSON: GA4, the acquisitions sheet,
#              Search Console), GMAIL_ADDRESS, GMAIL_APP_PASSWORD
#   Variables: BRIEF_RECIPIENTS_OLJ, BRIEF_RECIPIENTS_OT (optional; comma-separated, override the notebook's lists)

name: Weekly analytics brief

on:
  schedule:
    - cron: "25 8 * * 1"   # 08:25 UTC = 11:25 Beirut in summer (UTC+3)
    - cron: "25 9 * * 1"   # 09:25 UTC = 11:25 Beirut in winter (UTC+2)
  workflow_dispatch:        # "Run workflow" button: sends right away, to TEST_RECIPIENTS or to everyone (send_to)
    inputs:
      send_email:
        description: "Send the emails"
        type: boolean
        default: true
      send_to:
        description: "Who gets the briefs: test = TEST_RECIPIENTS only, everyone = the brands' real lists"
        type: choice
        options: [test, everyone]
        default: test
      claude_answer:
        description: "Claude answer (optional): paste the JSON line from Claude.ai -> the ★ notes and English titles go in the briefs"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: weekly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check it's the right start time for today (summer / winter)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=Asia/Beirut date +%z)
          RUN=true
          if [ "$EVENT" = "schedule" ]; then
            RUN=false
            if [ "$SCHED" = "25 8 * * 1" ] && [ "$OFFSET" = "+0300" ]; then RUN=true; fi
            if [ "$SCHED" = "25 9 * * 1" ] && [ "$OFFSET" = "+0200" ]; then RUN=true; fi
          fi
          echo "Beirut offset $OFFSET, trigger '$EVENT' '$SCHED' -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --quiet jupyter nbconvert ipykernel pandas openpyxl requests \
            google-api-python-client google-auth google-auth-oauthlib google-analytics-data python-docx

      - name: Write the service account key (GA4, the acquisitions Google Sheet, Search Console)
        if: steps.gate.outputs.run == 'true'
        env:
          GSHEET_SA_KEY: ${{ secrets.GSHEET_SA_KEY }}
        run: printf '%s' "$GSHEET_SA_KEY" > service_account.json

      - name: Run the notebook (builds, exports and emails the briefs + the Claude.ai file)
        if: steps.gate.outputs.run == 'true'
        env:
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}
          MATOMO_TOKEN: ${{ secrets.MATOMO_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_RECIPIENTS_OLJ: ${{ vars.BRIEF_RECIPIENTS_OLJ }}
          BRIEF_RECIPIENTS_OT: ${{ vars.BRIEF_RECIPIENTS_OT }}
          # Scheduled runs always send (and wait for 12:00); manual runs send only if ticked, and right away
          SEND_EMAIL: ${{ github.event_name == 'schedule' && '1' || (inputs.send_email && '1' || '0') }}
          SEND_NOW: ${{ github.event_name == 'schedule' && '0' || '1' }}
          SEND_TO: ${{ inputs.send_to || 'test' }}
          CLAUDE_ANSWER: ${{ inputs.claude_answer }}   # passed as an env var (never pasted into the shell command)
        run: |
          jupyter nbconvert --to notebook --execute weekly_report.ipynb \
            --output executed_weekly_report.ipynb --ExecutePreprocessor.timeout=-1

      - name: Keep the outputs (executed notebook, Word briefs, Claude.ai file, order CSV)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brief-${{ github.run_id }}
          path: |
            executed_weekly_report.ipynb
            *.docx
            Claude_translations_*.txt
            acquisitions_orders.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove the service account key
        if: always()
        run: rm -f service_account.json
